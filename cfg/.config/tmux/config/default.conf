# Standard boilerplate for a current tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
# From tmux-sensible
set -g focus-events on
set -g display-time 4000
set -g status-interval 5

# These are currently the correct settings for Linux. All terminals
# (tested with Ghostty and Ptyxis
# https://www.terminal.guide/tools/multiplexer/tmux/copy-mode-guide/
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
set -g set-clipboard off

setw -g mode-keys vi
