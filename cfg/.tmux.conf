# This should be standard boilerplate. But for transparency, they're from here:
# https://youtu.be/XivdyrFCV4M?si=-SNCQgclCAlZwSYl
# https://github.com/tonybanters/tmux-btw/blob/master/tmux.conf
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

# Let's leave this out and and leave it terminal-theme-agnostic
# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux .
